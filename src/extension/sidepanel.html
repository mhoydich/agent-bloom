<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AGENT BLOOM</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">TONE BLOOM / CHROME BRIDGE</p>
      <h1>AGENT<br />BLOOM</h1>
      <p class="lede">Browser companions write and conduct finite Tone Bloom scores here.</p>
      <section class="status" aria-live="polite" aria-atomic="true">
        <span id="lamp" aria-hidden="true"></span>
        <div>
          <strong id="state">READY</strong>
          <p id="detail">Waiting for a score.</p>
        </div>
      </section>
      <div class="actions">
        <button id="stop" type="button">STOP AUDIO</button>
        <button id="open" type="button">OPEN AGENT BLOOM ↗</button>
      </div>
      <p class="fine">Sound begins only for a valid score request. The bridge reads no browsing history.</p>
    </main>
    <script type="module" src="sidepanel.mjs"></script>
  </body>
</html>
